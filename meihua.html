<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>梅花易數｜人生劇本</title>
  <meta name="description" content="不用生日也能占，一事一占，問你現在最在意的那件事。">
  <meta name="theme-color" content="#0F2E2A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css?v=18">
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色/淺色模式" title="切換主題">🌙</button>
      <a class="screen-back" href="index.html">‹ 回首頁</a>
    </header>

    <div id="meihua-container" class="panel">
      <div class="sig" style="margin-bottom:12px;">
        <div class="kin">即時占卦</div>
        <div class="big" style="font-size:1.3rem;">🎲 梅花易數</div>
        <div style="font-size:.82rem;color:var(--muted);margin-top:4px;">一事一占，心念專注，問你現在最在意的那件事。</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
        <button id="meihua-time" class="btn-meihua active" type="button">⏰ 時間起卦</button>
        <button id="meihua-number" class="btn-meihua" type="button">🔢 報數起卦</button>
        <button id="meihua-text" class="btn-meihua" type="button">✍️ 文字起卦</button>
      </div>
      <div id="meihua-input-area">
        <div id="meihua-time-hint" style="font-size:.85rem;color:var(--muted);margin-bottom:10px;">心中想著你的問題，準備好就按下面的按鈕。</div>
        <div id="meihua-number-input" style="display:none;margin-bottom:10px;">
          <input type="text" id="meihua-num" placeholder="輸入任意數字（如 38 或 7,2）" style="width:100%;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:var(--text);font-size:.9rem;" aria-label="起卦數字">
        </div>
        <div id="meihua-text-input" style="display:none;margin-bottom:10px;">
          <input type="text" id="meihua-txt" placeholder="輸入文字（如：今天適合出門嗎）" style="width:100%;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:var(--text);font-size:.9rem;" maxlength="50" aria-label="起卦文字">
        </div>
      </div>
      <button id="meihua-go" class="btn-primary" type="button" style="width:100%;">起卦 ✦</button>
      <div id="meihua-result" style="margin-top:16px;"></div>
    </div>

    <p class="disclaimer">本網站分析結果僅供個人參考與自我探索，不構成任何醫療、法律、心理或財務建議。<span style="opacity:.45;">v18</span></p>
  </div>

  <script type="module" src="js/main.js?v=18"></script>
  <script src="js/sw-register.js?v=18"></script>
</body>
</html>
