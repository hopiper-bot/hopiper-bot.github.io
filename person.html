<body class="cosmic-v2">
  <div class="wrap">
    <header class="page-header"><button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色或淺色模式" title="切換主題">🌙</button><a class="screen-back" href="index.html">‹ 回到玄境</a></header>
    <main>
      <section id="view-person-compat" class="panel">
        <div class="sig"><div class="kin">SYNASTRY · TWO SOULS</div><div class="big" style="font-size:1.45rem;">☍ 雙人星軌</div><div style="font-size:.84rem;color:var(--muted);margin-top:5px;">讓兩張命盤交疊，看見彼此靠近的引力與需要理解的課題。</div></div>
        <label>對方出生日期</label>
        <div class="form-row"><div class="form-group"><input type="number" id="person2-year" placeholder="年份" min="1900" max="2100" aria-label="對方出生年份"></div><div class="form-group"><select id="person2-month" aria-label="對方出生月份"><option value="">月</option><option value="1">1月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option><option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option><option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select></div><div class="form-group"><input type="number" id="person2-day" placeholder="日" min="1" max="31" aria-label="對方出生日"></div></div>
        <label>對方出生時間 <span style="font-size:.78rem;color:var(--muted);font-weight:normal;">（選填）</span></label>
        <div class="form-row"><div class="form-group"><input type="number" id="person2-hour" placeholder="時（0-23）" min="0" max="23" aria-label="對方出生小時"></div><div class="form-group"><input type="number" id="person2-minute" placeholder="分（0-59）" min="0" max="59" aria-label="對方出生分鐘"></div></div>
        <label>對方性別</label><div class="form-row"><div class="form-group"><select id="person2-gender" aria-label="對方性別"><option value="male">男</option><option value="female">女</option></select></div></div>
        <label>關係類型</label><div class="form-row"><div class="form-group wide"><select id="person2-relation" aria-label="關係類型"><option value="partner">情侶／伴侶</option><option value="friend">朋友</option><option value="colleague">同事</option><option value="family">家人</option><option value="boss">主管／老闆</option></select></div></div>
        <button id="person-compat-go" class="btn-primary" type="button" style="width:100%;margin-top:15px;">讓兩道星軌交會 ✦</button>
        <div id="person-compat-error" style="color:#e8a2b3;font-size:.85rem;margin-top:8px;" role="alert"></div><div id="person-compat-result" style="margin-top:18px;"></div>
      </section>
